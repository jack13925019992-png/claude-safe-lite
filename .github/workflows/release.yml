name: Build & Release Client (Windows & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 顶层显式赋予默认 GITHUB_TOKEN 创建/更新 Release 与上传安装包的写权限（防止 403 Forbidden）
permissions:
  contents: write

# 同标签重推时自动取消上一轮未结束的旧任务，避免资源冲突与重复计费
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # CI 环境关闭增量编译以提速并大幅节省 Runner 磁盘空间；跳过外部代码签名证书自动扫描
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # ==========================================================================
  # 1. Windows 客户端云端打包 (x64 Setup 安装版 + MSI + 单文件免安装绿色版)
  # ==========================================================================
  build-windows:
    name: Build Windows x64 (.exe & .msi)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出客户端源码
        uses: actions/checkout@v4

      - name: 2. 安全门禁自检（拦截发卡器与私钥，不打印绝对路径）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($dir in @("admin-license-issuer", "cloud-license-worker", "release-portable")) {
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          }
          $leaked = Get-ChildItem -Recurse -File -Force | Where-Object {
            $_.FullName -notmatch '\\(\.git|node_modules)\\' -and (
              $_.Name -eq 'issuer-config.json' -or
              $_.Name -like '*授权码分发器*' -or
              $_.Extension -in @('.pem', '.key', '.p8', '.p12', '.pfx') -or
              $_.Name -match '^\.env(\..+)?$' -and $_.Name -ne '.env.example' -or
              $_.Name -match '(private.*key|secret.*key|ed25519.*seed)'
            )
          }
          if ($leaked) {
            $relNames = $leaked | ForEach-Object { $_.Name }
            Write-Error "安全门禁拦截：检测到敏感文件 ($($relNames -join ', '))！"
            exit 1
          }
          Write-Host "✓ Windows 安全门禁检查通过。"

      - name: 3. 配置 Node.js 20 与 npm 依赖缓存
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 4. 配置 Rust 工具链 (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 5. 启用 Rust Release 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: 6. 校验锁文件并安装前端与 Tauri CLI 依赖
        run: npm ci

      - name: 7. 编译并打包 Windows 未签名可用安装包与单文件绿色版
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx tauri build --bundles nsis,msi

      - name: 8. 核对并归档 Windows 安装产物
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $ver = $cfg.version
          New-Item -ItemType Directory -Force -Path "dist-artifacts" | Out-Null

          # 1) NSIS 一键向导安装版（匹配 bundle/nsis/*.exe）
          $nsisExe = Get-ChildItem -Path "src-tauri/target" -Filter "*setup*.exe" -Recurse |
            Where-Object { $_.FullName -match 'release[\\/]bundle[\\/]nsis' } |
            Select-Object -First 1
          if (-not $nsisExe) { Write-Error "未找到 NSIS 安装包！"; exit 1 }
          Copy-Item $nsisExe.FullName "dist-artifacts/Claude-Safe-Lite_v${ver}_Windows_x64_Setup.exe"

          # 2) 标准 MSI 安装包（匹配 bundle/msi/*.msi）
          $msiPkg = Get-ChildItem -Path "src-tauri/target" -Filter "*.msi" -Recurse |
            Where-Object { $_.FullName -match 'release[\\/]bundle[\\/]msi' } |
            Select-Object -First 1
          if ($msiPkg) {
            Copy-Item $msiPkg.FullName "dist-artifacts/Claude-Safe-Lite_v${ver}_Windows_x64_Installer.msi"
          }

          # 3) 免安装单文件绿色版（MSVC 静态内嵌 WebView2Loader）
          $portableExe = "src-tauri/target/release/claude-safe-lite.exe"
          if (-not (Test-Path $portableExe)) { Write-Error "未找到主程序 EXE！"; exit 1 }
          Copy-Item $portableExe "dist-artifacts/Claude-Safe-Lite_v${ver}_Windows_x64_Portable.exe"

          Get-ChildItem "dist-artifacts" | Select-Object Name, Length

      - name: 9. 上传 Windows 产物至工作流暂存区
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            dist-artifacts/*.exe
            dist-artifacts/*.msi
          if-no-files-found: error

  # ==========================================================================
  # 2. macOS 客户端云端打包 (Apple Silicon M系列芯片 + Intel 双架构通用 .dmg)
  #    注：采用官方标准 macos-15-intel 节点池，规避 macOS arm64 免费池排队超时取消问题，
  #        通过 Xcode Universal SDK 交叉合成 arm64 + x86_64 双架构通用安装包。
  # ==========================================================================
  build-macos:
    name: Build macOS Universal (.dmg)
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: 1. 检出客户端源码
        uses: actions/checkout@v4

      - name: 2. 安全门禁自检（拦截发卡器与私钥，不打印绝对路径）
        shell: bash
        run: |
          set -euo pipefail
          rm -rf admin-license-issuer cloud-license-worker release-portable
          LEAKED_FILES=$(find . \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            \( \
              -iname 'issuer-config.json' -o \
              -iname '*授权码分发器*' -o \
              -iname '*.pem' -o \
              -iname '*.key' -o \
              -iname '*.p8' -o \
              -iname '*.p12' -o \
              -iname '*.pfx' -o \
              -iname '.env' -o \
              \( -iname '.env.*' -not -iname '.env.example' \) -o \
              -iname '*private*key*' -o \
              -iname '*secret*key*' -o \
              -iname '*ed25519*seed*' \
            \) -exec basename {} \; || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "::error::安全门禁拦截：检测到敏感私钥或配置文件 ($LEAKED_FILES)！"
            exit 1
          fi
          echo "✓ macOS 安全门禁检查通过。"

      - name: 3. 配置 Node.js 20 与 npm 依赖缓存
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 4. 配置 Rust 工具链（同时挂载 Apple Silicon ARM64 与 Intel x86_64 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 5. 启用 Rust Release 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: 6. 校验锁文件并安装前端与 Tauri CLI 依赖
        run: npm ci

      - name: 7. 核验跨平台图标资源 (.icns & .ico)
        shell: bash
        run: |
          set -euo pipefail
          test -s "src-tauri/icons/icon.icns" || npx tauri icon src-tauri/icons/128x128.png
          test -s "src-tauri/icons/icon.ico"

      - name: 8. 编译并打包 macOS 双架构通用 .dmg（免开发者证书，Ad-hoc 本地签名）
        env:
          # 无需 Apple Developer 付费证书或任何 Secrets；"-" 为系统内置离线 Ad-hoc 标记，兼容 M 系列芯片内核校验
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: 9. 校验 Universal 双架构指令集并归档 .dmg
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          UNI_BIN="src-tauri/target/universal-apple-darwin/release/claude-safe-lite"
          ARCHS=$(lipo -archs "$UNI_BIN")
          echo "✓ 已验证 macOS 二进制架构: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::双架构校验失败！当前仅包含: $ARCHS"
            exit 1
          fi

          RAW_DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$RAW_DMG" ] || [ ! -f "$RAW_DMG" ]; then
            echo "::error::未找到生成的 .dmg 安装包！"
            exit 1
          fi

          mkdir -p dist-artifacts
          cp "$RAW_DMG" "dist-artifacts/Claude-Safe-Lite_v${VERSION}_macOS_Universal.dmg"
          ls -lh dist-artifacts/

      - name: 10. 上传 macOS 产物至工作流暂存区
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: dist-artifacts/*.dmg
          if-no-files-found: error

  # ==========================================================================
  # 3. 汇聚 Windows 与 macOS 全部安装包，原子发布（支持覆盖重发）到 GitHub Releases
  # ==========================================================================
  publish-release:
    name: Publish Dual-Platform GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 检出版本元数据
        uses: actions/checkout@v4

      - name: 2. 下载双端构建产物到统一发布目录
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 3. 核验双端安装包并生成 SHA-256 校验清单
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${VERSION}"
          fi
          RELEASE_TITLE="Claude Safe Lite ${TAG_NAME} (Windows & macOS)"

          # 确保 Windows (.exe) 与 macOS (.dmg) 核心安装包均已就位
          ls -lh release-assets/
          compgen -G "release-assets/*.exe" > /dev/null
          compgen -G "release-assets/*.dmg" > /dev/null

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          {
            echo "checksums<<EOF"
            cd release-assets
            for f in *.exe *.msi *.dmg; do
              [ -e "$f" ] || continue
              sum=$(sha256sum "$f" | awk '{print $1}')
              size=$(du -h "$f" | awk '{print $1}')
              echo "| \`$f\` | $size | \`$sum\` |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 4. 发布并覆盖上传双端安装包至 GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          prerelease: false
          make_latest: "true"
          overwrite_files: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.dmg
          body: |
            ### 🛡️ Claude Safe Lite 双平台客户端下载（Windows & macOS）

            #### 一、安装包选型指南
            - **💻 Windows 用户（推荐安装版）**：下载 `*_Windows_x64_Setup.exe`（向导安装并自动生成桌面快捷方式）；或下载 `*_Windows_x64_Portable.exe`（单文件免安装绿色版，双击即用）。
            - **🍎 macOS 用户（M 芯片 / Intel 通用）**：下载 `*_macOS_Universal.dmg`（双架构二合一安装包，同时原生支持 Apple Silicon M1~M4 与 Intel 芯片）。

            #### ✨ 核心特性亮点
            - **纯净防风控隔离浏览器**：自动屏蔽浏览器顶部命令行警告条，根据出口 IP 国家代码自动对齐 `TZ` 时区与 `en-US` 语言，支持右上角一键新建与切换**多账号独立浏览器环境**（物理隔离 Cookie）。
            - **系统托盘常驻与智能告警**：关闭窗口自动驻留系统托盘保持 `127.0.0.1:12223` 本地转发，支持免管理员弹窗**开机自动启动**、45 秒后台巡检异常系统通知、授权剩余天数直观展示与一键 `***` 脱敏诊断复制。

            #### 二、文件大小与 SHA-256 完整性校验
            | 安装包文件名 | 大小 | SHA-256 校验值 |
            | :--- | :--- | :--- |
            ${{ steps.meta.outputs.checksums }}

            ---

            #### 三、首次安装解除系统拦截说明

            **💻 Windows 首次打开提示「Windows 已保护你的电脑」时：**
            1. 在蓝色拦截弹窗中点击文字下方的 **【更多信息】**；
            2. 点击右下角新出现的 **【仍要运行】** 按钮即可正常安装或启动（仅首次需要）。

            **🍎 macOS 首次打开提示「无法验证开发者 / 已损坏」时：**
            1. 双击 `.dmg`，将 **Claude Safe Lite** 拖入右侧 **Applications（应用程序）** 文件夹；
            2. 首次打开若弹窗拦截：先点 **【完成/取消】** 关闭弹窗 → 打开 **【系统设置】→【隐私与安全性】** → 拉到底部点击 **【仍要打开】** 并验证密码即可；
            3. 如遇个别系统提示“已损坏，无法打开”，打开 **【终端 (Terminal)】** 执行以下一行命令回车即可放行：
               ```bash
               sudo xattr -rd com.apple.quarantine "/Applications/Claude Safe Lite.app"
               ```
